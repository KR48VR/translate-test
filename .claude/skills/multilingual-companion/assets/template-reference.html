<title>The AI Shift</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A multilingual classroom companion on how AI is reshaping Singapore's job market — read the same story in 13 languages.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=Noto+Sans:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+Thai:wght@400;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700;800&family=Noto+Sans+Malayalam:wght@400;600;700;800&family=Noto+Sans+Sinhala:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#F7F8F6; --surface:#FFFFFF; --surface2:#EFF1EC;
  --ink:#1A2330; --muted:#5A6473; --faint:#8A93A0; --line:#E0E4DC;
  --accent:#B3541E; --accent-ink:#8F3F12;
  --hl:rgba(230,159,0,.26); --hl-new:rgba(0,158,115,.18);
  --c-tech:#0072B2; --c-edu:#009E73; --c-hr:#D55E00; --c-fin:#CC79A7; --c-gov:#E69F00;
  --pos:#009E73; --neg:#3E4753;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.12);
  --f-display:'Archivo','Noto Sans',sans-serif;
  --f-body:'Noto Sans',system-ui,sans-serif;
  --lh-body:1.62;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131A24; --surface:#1B2432; --surface2:#212B3B;
    --ink:#E8EDF2; --muted:#9AA5B4; --faint:#6E7989; --line:#2A3546;
    --accent:#E08A4C; --accent-ink:#EDA36F;
    --hl:rgba(174,140,9,.32); --hl-new:rgba(4,138,96,.28);
    --c-tech:#2C89BF; --c-edu:#048A60; --c-hr:#C8551A; --c-fin:#C55CB0; --c-gov:#AE8C09;
    --pos:#0FA372; --neg:#98A2B0;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#131A24; --surface:#1B2432; --surface2:#212B3B;
  --ink:#E8EDF2; --muted:#9AA5B4; --faint:#6E7989; --line:#2A3546;
  --accent:#E08A4C; --accent-ink:#EDA36F;
  --hl:rgba(174,140,9,.32); --hl-new:rgba(4,138,96,.28);
  --c-tech:#2C89BF; --c-edu:#048A60; --c-hr:#C8551A; --c-fin:#C55CB0; --c-gov:#AE8C09;
  --pos:#0FA372; --neg:#98A2B0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
}
html[data-font="sc"]{ --f-body:'Noto Sans SC','Noto Sans',sans-serif; --f-display:'Archivo','Noto Sans SC',sans-serif; --lh-body:1.85; }
html[data-font="tc"]{ --f-body:'Noto Sans TC','Noto Sans',sans-serif; --f-display:'Archivo','Noto Sans TC',sans-serif; --lh-body:1.85; }
html[data-font="jp"]{ --f-body:'Noto Sans JP','Noto Sans',sans-serif; --f-display:'Archivo','Noto Sans JP',sans-serif; --lh-body:1.85; }
html[data-font="kr"]{ --f-body:'Noto Sans KR','Noto Sans',sans-serif; --f-display:'Archivo','Noto Sans KR',sans-serif; --lh-body:1.8; }
html[data-font="thai"]{ --f-body:'Noto Sans Thai','Noto Sans',sans-serif; --f-display:'Archivo','Noto Sans Thai',sans-serif; --lh-body:1.9; }
html[data-font="tamil"]{ --f-body:'Noto Sans Tamil','Noto Sans',sans-serif; --f-display:'Archivo','Noto Sans Tamil',sans-serif; --lh-body:1.85; }
html[data-font="deva"]{ --f-body:'Noto Sans Devanagari','Noto Sans',sans-serif; --f-display:'Archivo','Noto Sans Devanagari',sans-serif; --lh-body:1.85; }
html[data-font="mlym"]{ --f-body:'Noto Sans Malayalam','Noto Sans',sans-serif; --f-display:'Archivo','Noto Sans Malayalam',sans-serif; --lh-body:1.9; }
html[data-font="sinh"]{ --f-body:'Noto Sans Sinhala','Noto Sans',sans-serif; --f-display:'Archivo','Noto Sans Sinhala',sans-serif; --lh-body:1.9; }

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--f-body); line-height:var(--lh-body); font-size:16.5px;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
a{color:var(--accent-ink); text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent); text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2.5px solid var(--accent); outline-offset:2px; border-radius:3px}
.skip{position:absolute; left:-9999px; top:0; background:var(--surface); color:var(--ink); padding:.6em 1em; z-index:100; border-radius:0 0 8px 0}
.skip:focus{left:0}
.wrap{max-width:1120px; margin:0 auto; padding:0 clamp(16px,4vw,40px)}
.prose{max-width:680px; margin-left:auto; margin-right:auto}
.prose p{margin:0 0 1.1em}
.spectrum{display:flex; height:5px; border-radius:99px; overflow:hidden; gap:2px}
.spectrum i{flex:1}
.spectrum i:nth-child(1){background:var(--c-tech)}
.spectrum i:nth-child(2){background:var(--c-edu)}
.spectrum i:nth-child(3){background:var(--c-hr)}
.spectrum i:nth-child(4){background:var(--c-fin)}
.spectrum i:nth-child(5){background:var(--c-gov)}

/* ---------- header ---------- */
header.top{
  position:sticky; top:0; z-index:50; background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.top-inner{display:flex; align-items:center; gap:14px; padding:10px clamp(16px,4vw,40px); max-width:1240px; margin:0 auto; flex-wrap:wrap}
.brand{font-family:var(--f-display); font-weight:800; font-size:17px; letter-spacing:.2px; white-space:nowrap; color:var(--ink); text-decoration:none; display:flex; align-items:center; gap:9px}
.brand .dotrow{display:flex; gap:3px}
.brand .dotrow i{width:7px; height:7px; border-radius:50%}
.langbar{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; flex:1; min-width:200px; padding:2px}
.langbar::-webkit-scrollbar{display:none}
.langchip{
  flex:0 0 auto; border:1px solid var(--line); background:var(--surface); color:var(--muted);
  border-radius:99px; padding:4.5px 13px; font-size:13.5px; font-family:var(--f-body);
  cursor:pointer; transition:all .15s; line-height:1.5;
}
.langchip:hover{border-color:var(--accent); color:var(--ink)}
.langchip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:700}
.cmpbox{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted); white-space:nowrap}
.cmpbox select{
  font:inherit; font-size:13px; color:var(--ink); background:var(--surface);
  border:1px solid var(--line); border-radius:8px; padding:4px 8px; max-width:130px;
}
@media (max-width:760px){
  header.top{position:static}
  .top-inner{padding-top:8px; padding-bottom:8px}
}

/* ---------- hero ---------- */
.hero{padding:clamp(48px,9vh,96px) 0 clamp(36px,6vh,64px); position:relative}
.kicker{font-family:var(--f-display); font-weight:700; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-ink); margin:0 0 18px}
html[data-font="sc"] .kicker,html[data-font="tc"] .kicker,html[data-font="jp"] .kicker,html[data-font="kr"] .kicker{letter-spacing:.35em}
.hero h1{
  font-family:var(--f-display); font-weight:880; font-variation-settings:'wght' 880;
  font-size:clamp(44px,9vw,96px); line-height:1.02; margin:0 0 10px; letter-spacing:-.015em; text-wrap:balance;
}
.hero .spectrum{max-width:420px; margin:26px 0}
.hero .sub{font-size:clamp(18px,2.4vw,23px); line-height:1.45; color:var(--muted); max-width:640px; margin:0 0 26px; text-wrap:balance; font-weight:400}
.hero .basedOn{font-size:14px; color:var(--faint); max-width:560px; border-inline-start:3px solid var(--line); padding-inline-start:14px}
.hero .basedOn a{color:var(--accent-ink)}
.pill-nav{display:flex; flex-wrap:wrap; gap:8px; margin-top:34px}
.pill-nav a{
  text-decoration:none; font-size:13.5px; font-weight:600; color:var(--ink);
  border:1px solid var(--line); background:var(--surface); padding:7px 15px; border-radius:99px; transition:all .15s;
}
.pill-nav a:hover{border-color:var(--accent); transform:translateY(-1px)}
.pill-nav a i{display:inline-block; width:8px; height:8px; border-radius:50%; margin-inline-end:7px}

/* ---------- sections ---------- */
section{padding:clamp(44px,8vh,86px) 0; position:relative}
section + section{border-top:1px solid var(--line)}
.sec-head{max-width:680px; margin:0 auto clamp(26px,4vh,44px)}
.sec-head .kicker{margin-bottom:12px}
h2{font-family:var(--f-display); font-weight:800; font-size:clamp(28px,4.6vw,44px); line-height:1.12; margin:0 0 16px; letter-spacing:-.01em; text-wrap:balance}
h3{font-family:var(--f-display); font-weight:750; font-size:clamp(21px,3vw,27px); line-height:1.2; margin:2.2em 0 .7em; text-wrap:balance}
.lead{font-size:clamp(17px,2vw,19.5px); color:var(--ink)}
.note{font-size:13.5px; color:var(--faint)}
.hl{background:var(--hl); padding:.06em .22em; border-radius:4px; box-decoration-break:clone; -webkit-box-decoration-break:clone; font-weight:600}
.hlNew{background:var(--hl-new); padding:.06em .22em; border-radius:4px; box-decoration-break:clone; -webkit-box-decoration-break:clone; font-weight:600}

/* ---------- case study ---------- */
.case-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:16px; margin:34px 0}
.case-card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px 20px 16px; box-shadow:var(--shadow)}
.case-card .label{font-family:var(--f-display); font-weight:750; font-size:15px; margin-bottom:14px; display:flex; align-items:center; gap:8px}
.case-card .label::before{content:""; width:9px; height:9px; border-radius:50%; background:var(--c-edu)}
.ba{display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:stretch}
.ba .col{display:flex; flex-direction:column; gap:4px}
.ba .tag{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--faint)}
.ba .stat{font-family:var(--f-display); font-weight:830; font-size:clamp(19px,2.2vw,24px); line-height:1.1; font-variant-numeric:tabular-nums}
.ba .after .stat{color:var(--c-edu)}
.ba .after .tag{color:var(--c-edu)}
.ba .desc{font-size:13px; color:var(--muted); line-height:1.5}
.ba .arrow{align-self:center; color:var(--faint); font-size:18px}

/* ---------- charts common ---------- */
.chart-card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:clamp(16px,3vw,28px); box-shadow:var(--shadow)}
.chart-title{font-family:var(--f-display); font-weight:800; font-size:clamp(18px,2.4vw,22px); margin:0 0 4px; line-height:1.25}
.chart-sub{font-size:13.5px; color:var(--muted); margin:0 0 18px}
.chart-src{font-size:12px; color:var(--faint); margin-top:14px}
.chart-note{font-size:12px; color:var(--faint); margin-top:4px}
.tableview{margin-top:12px; font-size:13px}
.tableview summary{cursor:pointer; color:var(--accent-ink); font-weight:600}
.tableview table{border-collapse:collapse; margin-top:10px; width:100%; max-width:520px}
.tableview th,.tableview td{border-bottom:1px solid var(--line); text-align:start; padding:5px 10px 5px 0; font-variant-numeric:tabular-nums}
.tableview th{color:var(--muted); font-weight:600; font-size:12px}
.tooltip{
  position:fixed; z-index:99; pointer-events:none; background:var(--ink); color:var(--bg);
  font-size:12.5px; line-height:1.4; padding:7px 11px; border-radius:8px; max-width:240px;
  opacity:0; transition:opacity .12s; box-shadow:var(--shadow);
}
.tooltip.show{opacity:1}

/* ---------- s1 scrolly ---------- */
.scrolly{display:grid; grid-template-columns:minmax(0,1fr); gap:28px; margin-top:8px}
@media(min-width:960px){
  .scrolly{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr); align-items:start; gap:40px}
  .scrolly .sticky{position:sticky; top:86px}
}
.steps{display:flex; flex-direction:column; gap:18px}
@media(min-width:960px){ .steps{padding:12vh 0 20vh; gap:38vh} }
.step{background:var(--surface); border:1px solid var(--line); border-inline-start:4px solid var(--faint); border-radius:14px; padding:18px 20px; box-shadow:var(--shadow); font-size:15.5px}
.step[data-ind="tech"]{border-inline-start-color:var(--c-tech)}
.step[data-ind="edu"]{border-inline-start-color:var(--c-edu)}
.step[data-ind="hr"]{border-inline-start-color:var(--c-hr)}
.step p{margin:0}
#bump{overflow-x:auto}
#bump svg{width:100%; min-width:640px; height:auto; display:block}
.bump-legend{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px}
.indchip{
  display:inline-flex; align-items:center; gap:7px; border:1.5px solid var(--line); border-radius:99px;
  background:transparent; color:var(--ink); font-size:12.5px; font-weight:600; font-family:var(--f-body);
  padding:4px 12px; cursor:pointer; transition:all .15s;
}
.indchip i{width:9px; height:9px; border-radius:50%; background:var(--dot)}
.indchip[aria-pressed="true"]{border-color:var(--dot); background:color-mix(in srgb,var(--dot) 12%,transparent)}
.skills-panel{margin-top:16px; border-top:1px dashed var(--line); padding-top:14px; min-height:96px}
.skills-panel .sp-title{font-size:13px; font-weight:700; color:var(--muted); margin:0 0 9px}
.skills-panel .chips{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:9px}
.skills-panel .chips span{background:var(--surface2); border-radius:8px; padding:4px 11px; font-size:13px}
.skills-panel .entry{font-size:13px; color:var(--muted)}
.skills-panel .entry b{color:var(--ink); font-variant-numeric:tabular-nums}

/* ---------- trends & bars ---------- */
#trendsChart{overflow-x:auto}
#trendsChart svg{width:100%; min-width:540px; height:auto; display:block}
.legend{display:flex; gap:18px; flex-wrap:wrap; font-size:13px; margin-bottom:8px}
.legend span{display:inline-flex; align-items:center; gap:7px; color:var(--muted); font-weight:600}
.legend i{width:16px; height:3.5px; border-radius:2px}
.trend-steps{display:grid; gap:14px; margin-top:26px}
@media(min-width:860px){ .trend-steps{grid-template-columns:repeat(3,1fr)} }
.trend-step{background:var(--surface2); border-radius:14px; padding:16px 18px; font-size:14.5px}
.trend-step .num{font-family:var(--f-display); font-weight:830; font-size:26px; display:block; margin-bottom:6px; font-variant-numeric:tabular-nums}
.hbars{display:flex; flex-direction:column; gap:7px; margin-top:6px}
.hbar{display:grid; grid-template-columns:minmax(120px,38%) 1fr; gap:12px; align-items:center; font-size:13.5px}
.hbar .lbl{text-align:end; color:var(--muted); line-height:1.3}
.hbar .track{display:flex; align-items:center; gap:8px; min-width:0}
.hbar .bar{height:17px; border-radius:0 4px 4px 0; background:var(--c-tech); min-width:2px; transition:width .5s ease}
.hbar .val{font-variant-numeric:tabular-nums; font-weight:700; font-size:13px}
.hbar.hi .lbl{color:var(--ink); font-weight:800}
.hbar.hi .bar{background:var(--accent)}
.hbar:hover .lbl{color:var(--ink)}
.wef{display:flex; flex-direction:column; gap:14px; margin-top:22px}
.wefrow{display:grid; grid-template-columns:minmax(110px,30%) 1fr; gap:14px; align-items:center}
.wefrow .lbl{text-align:end; font-size:14px; color:var(--muted); font-weight:600; line-height:1.3}
.wefrow .track{display:flex; align-items:center; gap:10px}
.wefrow .bar{height:34px; border-radius:0 6px 6px 0}
.wefrow.displaced .bar{background:var(--neg)}
.wefrow.created .bar{background:var(--pos)}
.wefrow .val{font-family:var(--f-display); font-weight:830; font-size:21px; font-variant-numeric:tabular-nums}
.wefrow .unit{font-size:12px; color:var(--faint); font-weight:400}
.wefnet{align-self:flex-end; background:var(--hl-new); border-radius:99px; padding:6px 16px; font-weight:700; font-size:14px}

/* ---------- quotes & tips ---------- */
.qcard{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px 22px; margin:26px auto; max-width:680px; box-shadow:var(--shadow); position:relative}
.qcard::before{content:"“"; position:absolute; top:2px; inset-inline-start:16px; font-family:var(--f-display); font-size:52px; line-height:1; color:var(--line); font-weight:800}
.qcard .qtext{margin:14px 0 12px; font-size:15.5px}
.qcard .qwho{display:flex; flex-direction:column; gap:1px; border-top:1px solid var(--line); padding-top:10px}
.qcard .qname{font-weight:800; font-size:14px}
.qcard .qrole{font-size:12.5px; color:var(--muted)}
.stat-tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin:26px 0}
.stat-tile{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:var(--shadow)}
.stat-tile .v{font-family:var(--f-display); font-weight:870; font-size:clamp(26px,3.4vw,34px); line-height:1.05; color:var(--accent-ink); font-variant-numeric:tabular-nums}
.stat-tile .l{font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--faint); margin:6px 0 8px}
.stat-tile .t{font-size:13.5px; color:var(--muted); line-height:1.5}
.tipcard{background:linear-gradient(135deg,color-mix(in srgb,var(--c-edu) 9%,var(--surface)),var(--surface)); border:1px solid color-mix(in srgb,var(--c-edu) 35%,var(--line)); border-radius:18px; padding:24px 26px; margin:30px auto; max-width:680px}
.tipcard h3{margin-top:0}

/* ---------- reading / videos ---------- */
.read-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; margin-top:8px}
.read-group{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px; box-shadow:var(--shadow)}
.read-group h3{margin:0 0 12px; font-size:17px}
.read-group ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px}
.read-group a{display:block; font-size:14px; line-height:1.5; color:var(--ink); text-decoration:none; padding-inline-start:18px; position:relative}
.read-group a::before{content:"↗"; position:absolute; inset-inline-start:0; color:var(--accent-ink); font-weight:700}
.read-group a:hover{color:var(--accent-ink)}
.zh-chip{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.05em; color:var(--faint); border:1px solid var(--line); border-radius:5px; padding:0 5px; margin-inline-start:6px; vertical-align:1px}
.video-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; max-width:760px; margin:0 auto}
.video-card{display:block; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px; text-decoration:none; color:var(--ink); box-shadow:var(--shadow); transition:transform .15s}
.video-card:hover{transform:translateY(-2px)}
.video-card .play{width:40px; height:40px; border-radius:50%; background:var(--ink); color:var(--bg); display:flex; align-items:center; justify-content:center; margin-bottom:14px}
.video-card .play::before{content:""; border-style:solid; border-width:7px 0 7px 12px; border-color:transparent transparent transparent currentColor; margin-inline-start:3px}
.video-card h3{margin:0 0 8px; font-size:16.5px}
.video-card p{margin:0; font-size:13.5px; color:var(--muted)}

/* ---------- about ---------- */
.about{background:var(--surface2); border-top:1px solid var(--line); padding:clamp(44px,7vh,72px) 0}
.about .prose{font-size:14.5px; color:var(--muted)}
.about h2{font-size:24px}
.about h3{font-size:15px; margin-top:1.8em}
.about ul{padding-inline-start:20px; margin:.4em 0}
.about li{margin-bottom:.3em}
.footer-end{margin-top:34px; padding-top:18px; border-top:1px solid var(--line); font-size:12.5px; color:var(--faint)}

/* ---------- compare mode ---------- */
body.compare-on .cmp{cursor:pointer; border-bottom:1.5px dashed color-mix(in srgb,var(--accent) 40%,transparent)}
body.compare-on .cmp:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.cmp-block{
  background:color-mix(in srgb,var(--accent) 7%,var(--surface)); border-inline-start:3px solid var(--accent);
  border-radius:0 10px 10px 0; padding:12px 16px; margin:10px 0 16px; font-size:.95em;
}
.cmp-hint{

/* ---------- pixel art ---------- */
:root{
  --px-k:#26303F; --px-w:#FDFDFB; --px-m:#9AA5B2; --px-d:#5A6473;
  --px-s:#E9B586; --px-h:#6B4A2F; --px-t:#2E7D4F; --px-sky:transparent;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --px-k:#D3DCE7; --px-w:#31405A; --px-m:#7C8899; --px-d:#A5AFBD; }
}
:root[data-theme="dark"]{ --px-k:#D3DCE7; --px-w:#31405A; --px-m:#7C8899; --px-d:#A5AFBD; }
.px{display:block}
.px svg{display:block; width:100%; height:auto; shape-rendering:crispEdges}
#skyline{margin:34px 0 6px; max-width:760px; opacity:.95}
.sec-head.with-art{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:18px 28px; align-items:center}
.sec-head.with-art > .art{width:clamp(74px,9vw,110px); justify-self:end; align-self:end}
@media(max-width:560px){ .sec-head.with-art > .art{width:64px} }
.art-row{display:grid; grid-template-columns:auto minmax(0,1fr); gap:26px; align-items:start; max-width:680px; margin:0 auto}
.art-row .art{width:clamp(64px,8vw,96px); margin-top:6px}
@media(max-width:560px){ .art-row{grid-template-columns:1fr} .art-row .art{width:64px} }

/* ---------- fact & expert cards ---------- */
.fact-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:16px; max-width:860px; margin:26px auto}
.fact-card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px; box-shadow:var(--shadow); display:grid; grid-template-columns:52px minmax(0,1fr); gap:16px; align-items:start; font-size:15px}
.fact-card .art{width:52px; margin-top:4px}
.fact-card p{margin:0}
.expert-card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px 22px; margin:18px auto; max-width:680px; box-shadow:var(--shadow); font-size:15.5px}
.expert-card .eh{display:flex; align-items:center; gap:12px; margin-bottom:12px}
.expert-card .eh .art{width:38px}
.echip{font-family:var(--f-display); font-weight:800; font-size:12px; letter-spacing:.1em; color:var(--accent-ink); background:color-mix(in srgb,var(--accent) 10%,transparent); border-radius:7px; padding:3px 10px}
.expert-card p{margin:0 0 .9em} .expert-card p:last-child{margin-bottom:0}
.bridge{display:grid; grid-template-columns:auto minmax(0,1fr); gap:14px; align-items:center; max-width:600px; margin:26px auto; color:var(--muted); font-size:15px}
.bridge .art{width:34px}
.qcard .qwho{flex-direction:row; align-items:center; gap:11px}
.qcard .qwho .art{width:36px; flex:0 0 auto}
.qcard .qwho .qmeta{display:flex; flex-direction:column; gap:1px}
.stat-tile .art{width:40px; margin-bottom:10px}
.tipcard .tiphead{display:flex; align-items:center; gap:14px}
.tipcard .tiphead .art{width:44px; flex:0 0 auto}
.case-card .label .art{width:22px}
.case-card .label::before{display:none}

/* ---------- more-detail chips (deep-dive paragraphs collapsed by default) ---------- */
[data-detail]:not(.expanded){display:none}
[data-detail]:not(.expanded) + .cmp-block{display:none}
.more-stub{
  display:inline-flex; align-items:center; gap:7px; margin:2px 0 16px;
  border:1.5px dashed color-mix(in srgb,var(--accent) 50%,transparent); background:transparent;
  color:var(--accent-ink); border-radius:99px; padding:4.5px 15px;
  font-family:var(--f-body); font-size:12.5px; font-weight:700; cursor:pointer; transition:all .15s;
}
.more-stub:hover{background:color-mix(in srgb,var(--accent) 9%,transparent); border-style:solid}
[data-detail].expanded + .more-stub{display:none}

/* ---------- read aloud ---------- */
.listen-btn{
  display:inline-flex; align-items:center; gap:8px; margin-top:14px;
  border:1.5px solid var(--line); background:var(--surface); color:var(--muted);
  border-radius:99px; padding:6px 16px; font-family:var(--f-body); font-size:13px; font-weight:700;
  cursor:pointer; transition:all .15s;
}
.listen-btn .art{width:15px}
.listen-btn:hover{border-color:var(--accent); color:var(--ink)}
.listen-btn[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 12%,var(--surface)); border-color:var(--accent); color:var(--accent-ink)}
.speaking{outline:2.5px solid color-mix(in srgb,var(--accent) 55%,transparent); outline-offset:4px; border-radius:6px}
.voice-hint{font-size:12.5px; color:var(--accent-ink); margin-top:8px; max-width:420px}
.voice-sel{
  margin:14px 0 0 10px; font-family:var(--f-body); font-size:12px; color:var(--muted);
  background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:5px 8px;
  max-width:190px; vertical-align:bottom;
}
@media (prefers-reduced-motion: no-preference){
  .listen-btn[aria-pressed="true"] .art{animation:pulse 1.2s ease-in-out infinite}

/* ---------- visit-the-original nudges ---------- */
.orig-nudge{
  display:grid; grid-template-columns:46px minmax(0,1fr); gap:16px; align-items:center;

}
.orig-nudge:hover{transform:translateY(-2px)}

function get(dict, path){ return path.split(".").reduce((o,k)=>o&&o[k]!==undefined?o[k]:undefined, dict); }

function LC(path){ const v = get(I18N[cmpLang]||{}, path); return v!==undefined?v:""; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function rich(s){
  // only our own controlled markup survives: hl spans + br
  s = esc(s);
  s = s.replace(/&lt;span class='hl'&gt;/g,"<span class='hl'>")
       .replace(/&lt;span class='hlNew'&gt;/g,"<span class='hlNew'>")
       .replace(/&lt;span class="hl"&gt;/g,"<span class='hl'>")
       .replace(/&lt;span class="hlNew"&gt;/g,"<span class='hlNew'>")
       .replace(/&lt;\/span&gt;/g,"</span>")
       .replace(/&lt;br\s*\/?&gt;/g,"<br>");
  return s;
}

const PXC = { k:"var(--px-k)", w:"var(--px-w)", m:"var(--px-m)", d:"var(--px-d)", s:"var(--px-s)", h:"var(--px-h)", t:"var(--px-t)",
              b:"var(--c-tech)", g:"var(--c-edu)", o:"var(--c-hr)", p:"var(--c-fin)", y:"var(--c-gov)" };
function px(rows){
  const h = rows.length, w = rows[0].length;
  let out = `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true" focusable="false">`;
  rows.forEach((row,y)=>{
    let x=0;
    while(x<w){
      const c=row[x];
      if(c==="." ){x++;continue;}
      let run=1; while(x+run<w && row[x+run]===c) run++;
      if(PXC[c]) out+=`<rect x="${x}" y="${y}" width="${run}" height="1" fill="${PXC[c]}"/>`;
      x+=run;
    }
  });
  return out+"</svg>";
}

function buildSkyline(){
  const W=96,H=14;
  const g=Array.from({length:H},()=>Array(W).fill("."));
  const set=(x,y,c)=>{ if(x>=0&&x<W&&y>=0&&y<H) g[y][x]=c; };
  const rect=(x0,y0,w,h,c)=>{ for(let y=y0;y<y0+h;y++) for(let x=x0;x<x0+w;x++) set(x,y,c); };
  const bldg=(x0,w,h)=>{ rect(x0,13-h,w,h,"k"); for(let y=14-h;y<12;y+=2) for(let x=x0+1;x<x0+w-1;x+=2) set(x,y,"y"); };
  rect(0,13,W,1,"k");                        // ground
  bldg(1,7,7); bldg(9,6,9);                  // flats
  const cx=22,cy=6;                          // Singapore Flyer
  [[0,-5],[2,-5],[-2,-5],[3,-4],[-3,-4],[4,-2],[-4,-2],[5,0],[-5,0],[4,2],[-4,2],[3,4],[-3,4],[2,5],[-2,5],[0,5],[4,-3],[-4,-3],[4,3],[-4,3]]
    .forEach(([dx,dy])=>set(cx+dx,cy+dy,"m"));
  set(cx,cy,"k"); set(cx-1,cy,"m"); set(cx+1,cy,"m"); set(cx,cy-1,"m"); set(cx,cy+1,"m");
  set(cx-1,12,"k"); set(cx+1,12,"k"); set(cx-1,11,"k"); set(cx+1,11,"k"); set(cx,11,"k");
  bldg(29,7,4);                              // shophouse row
  rect(38,3,20,1,"k"); set(57,2,"k"); set(58,2,"k");   // MBS deck + prow
  [40,46,52].forEach(x0=>{ rect(x0,4,4,9,"k"); for(let y=5;y<12;y+=2){ set(x0+1,y,"y"); set(x0+2,y,"y"); } });
  rect(62,6,6,7,"k"); set(64,4,"k"); set(64,5,"k"); set(65,5,"y");   // spire tower
  [[72,5],[78,7],[84,5]].forEach(([x,h])=>{                            // supertrees
    rect(x,13-h+2,2,h-2,"d");
    rect(x-1,13-h+1,4,1,"t"); rect(x-2,13-h,6,1,"t"); set(x,13-h-1,"t"); set(x+1,13-h-1,"t");
  });
  bldg(90,5,4);
  return g.map(r=>r.join(""));
}

/* ---------------- bump chart ---------------- */
let activeInd = "", indLock = false;
function wrapLines(str, max){
  const hasSpace = /\s/.test(str);
  if(str.length<=max) return [str];
  if(hasSpace){
    const words = str.split(/\s+/); const lines=[]; let cur="";
    words.forEach(w=>{ if((cur+" "+w).trim().length>max && cur){ lines.push(cur); cur=w; } else cur=(cur+" "+w).trim(); });
    if(cur) lines.push(cur);
    return lines.slice(0,3);
  }
  const lines=[]; for(let i=0;i<str.length;i+=max) lines.push(str.slice(i,i+max));
  return lines.slice(0,3);
}
function renderBump(){
  const W=900,H=380,mL=250,mR=250,mT=34,mB=30;
  const iw=W-mL-mR, ih=H-mT-mB;
  const x=i=>mL+iw*i/(YEARS.length-1);
  const y=r=>mT+ih*(r-1)/4;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(L("s1.chart1Title"))}">`;
  s += `<text x="${mL-28}" y="${mT-14}" font-size="12" fill="var(--faint)" text-anchor="start" font-family="var(--f-body)">${esc(L("ui.rankLabel"))}</text>`;
  YEARS.forEach((yr,i)=>{
    s+=`<line x1="${x(i)}" y1="${mT-4}" x2="${x(i)}" y2="${H-mB+4}" stroke="var(--line)" stroke-width="1"/>`;
    s+=`<text x="${x(i)}" y="${H-6}" font-size="13" font-weight="700" fill="var(--muted)" text-anchor="middle" font-family="var(--f-body)">${yr}</text>`;
  });
  for(let r=1;r<=5;r++){ s+=`<text x="${mL-14}" y="${y(r)+4}" font-size="11.5" fill="var(--faint)" text-anchor="end" font-family="var(--f-body)">#${r}</text>`; }
  IND.forEach(d=>{
    const dim = activeInd && activeInd!==d.id;
    const op = dim?0.25:1;
    const pts = d.ranks.map((r,i)=>`${x(i)},${y(r)}`).join(" ");
    s+=`<g class="bump-series" data-ind="${d.id}" style="opacity:${op};transition:opacity .3s;cursor:pointer">`;
    s+=`<polyline points="${pts}" fill="none" stroke="${d.color}" stroke-width="${activeInd===d.id?5:3.5}" stroke-linecap="round" stroke-linejoin="round"/>`;
    d.ranks.forEach((r,i)=>{ s+=`<circle cx="${x(i)}" cy="${y(r)}" r="${activeInd===d.id?7:5.5}" fill="${d.color}" stroke="var(--surface)" stroke-width="2" class="pt" data-tip="${esc(L("s1.industries."+d.id))} · ${YEARS[i]} · #${r}"/>`; });
    const name = L("s1.industries."+d.id);
    const linesL = wrapLines(name, 22), linesR = linesL;
    const y0 = y(d.ranks[0]), yN = y(d.ranks[d.ranks.length-1]);
    linesL.forEach((ln,li)=>{ s+=`<text x="${mL-46}" y="${y0+4+(li-(linesL.length-1)/2)*15}" font-size="12.5" font-weight="${activeInd===d.id?800:600}" fill="${d.color}" text-anchor="end" font-family="var(--f-body)">${esc(ln)}</text>`; });
    linesR.forEach((ln,li)=>{ s+=`<text x="${W-mR+46}" y="${yN+4+(li-(linesR.length-1)/2)*15}" font-size="12.5" font-weight="${activeInd===d.id?800:600}" fill="${d.color}" text-anchor="start" font-family="var(--f-body)">${esc(ln)}</text>`; });
    s+=`</g>`;
  });
  s+=`</svg>`;
  document.getElementById("bump").innerHTML = s;
  document.querySelectorAll(".bump-series").forEach(g=>{ g.addEventListener("click",()=>selectInd(g.getAttribute("data-ind")===activeInd?"":g.getAttribute("data-ind"), true)); });
  // legend chips
  const leg = document.getElementById("bumpLegend");
  leg.innerHTML = "";
  IND.forEach(d=>{
    const b=document.createElement("button");
    b.className="indchip"; b.style.setProperty("--dot",`var(--c-${d.id})`);
    b.innerHTML = `<i></i>${esc(L("s1.industries."+d.id))}`;
    b.setAttribute("aria-pressed", activeInd===d.id?"true":"false");
    b.onclick=()=>selectInd(activeInd===d.id?"":d.id, true);
    leg.appendChild(b);
  });
  renderSkills();
  // data table
  document.getElementById("bumpTable").innerHTML =
    `<table><tr><th></th>${YEARS.map(yv=>`<th>${yv}</th>`).join("")}</tr>`+
    IND.map(d=>`<tr><td>${esc(L("s1.industries."+d.id))}</td>${d.ranks.map(r=>`<td>#${r}</td>`).join("")}</tr>`).join("")+`</table>`;
}

  const d = IND.find(x=>x.id===activeInd);
  const title = L("ui.skillsFor").replace("{industry}", L("s1.industries."+d.id));
  const chips = d.skills.map(k=>`<span>${esc(L("s1.skills."+k))}</span>`).join("") + (d.none?`<span style="color:var(--faint)">${esc(L("s1.skills.none"))}</span>`:"");
  const entry = L("s1.entryLabel").replace("{pct}", `<b>${d.entry}%</b>`);
  p.innerHTML = `<p class="sp-title">${esc(title)}</p><div class="chips">${chips}</div><p class="entry">${entry}</p>`;
}

/* ---------------- trends chart ---------------- */
function renderTrends(){
  const W=760,H=380,mL=52,mR=150,mT=26,mB=40;
  const iw=W-mL-mR, ih=H-mT-mB;
  const x=i=>mL+iw*i/2;
  const y=v=>mT+ih*(1-v/110);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(L("s1.trends.title"))}">`;
  [0,25,50,75,100].forEach(g=>{
    s+=`<line x1="${mL}" y1="${y(g)}" x2="${W-mR}" y2="${y(g)}" stroke="var(--line)" stroke-width="1"/>`;
    s+=`<text x="${mL-9}" y="${y(g)+4}" font-size="11.5" fill="var(--faint)" text-anchor="end" font-family="var(--f-body)" style="font-variant-numeric:tabular-nums">${g}</text>`;
  });
  YEARS.forEach((yr,i)=>{ s+=`<text x="${x(i)}" y="${H-10}" font-size="13" font-weight="700" fill="var(--muted)" text-anchor="middle" font-family="var(--f-body)">${yr}</text>`; });
  const series=[ {k:"ads", c:"var(--c-tech)", data:TRENDS.ads, lbl:L("s1.trends.adsLabel")},
                 {k:"apps",c:"var(--c-fin)", data:TRENDS.apps,lbl:L("s1.trends.appsLabel")} ];
  series.forEach(sr=>{
    const pts = sr.data.map((d,i)=>`${x(i)},${y(d.v)}`).join(" ");
    s+=`<polyline points="${pts}" fill="none" stroke="${sr.c}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"${sr.k==="apps"?` stroke-dasharray="1 0"`:""}/>`;
    sr.data.forEach((d,i)=>{ s+=`<circle cx="${x(i)}" cy="${y(d.v)}" r="6" fill="${sr.c}" stroke="var(--surface)" stroke-width="2" class="pt" tabindex="0" data-tip="${esc(sr.lbl)} · ${d.year} · ${d.v}" aria-label="${esc(sr.lbl)} ${d.year}: ${d.v}"/>`; });
    const last = sr.data[sr.data.length-1];
    wrapLines(sr.lbl,18).forEach((ln,li)=>{ s+=`<text x="${W-mR+14}" y="${y(last.v)+4+li*15}" font-size="12.5" font-weight="700" fill="${sr.c}" font-family="var(--f-body)">${esc(ln)}</text>`; });
  });
  // annotations
  s+=`<text x="${x(1)}" y="${y(26)+24}" font-size="13" font-weight="800" fill="var(--c-tech)" text-anchor="middle" font-family="var(--f-body)">−74%</text>`;
  s+=`<text x="${x(2)-70}" y="${y(68)}" font-size="13" font-weight="800" fill="var(--c-tech)" text-anchor="middle" font-family="var(--f-body)">×3</text>`;
  s+=`<text x="${x(2)-14}" y="${y(51)+26}" font-size="13" font-weight="800" fill="var(--c-fin)" text-anchor="end" font-family="var(--f-body)">−17%</text>`;
  s+=`</svg>`;
  document.getElementById("trendsChart").innerHTML = s;
  document.getElementById("trendsTable").innerHTML =
    `<table><tr><th></th>${YEARS.map(yv=>`<th>${yv}</th>`).join("")}</tr>`+
    series.map(sr=>`<tr><td>${esc(sr.lbl)}</td>${sr.data.map(d=>`<td>${d.v}</td>`).join("")}</tr>`).join("")+`</table>`;
}

/* ---------------- tooltip ---------------- */
const tip = document.getElementById("tooltip");
document.addEventListener("pointerover", e=>{
  const t = e.target.closest ? e.target.closest(".pt") : null;
  if(!t){ tip.classList.remove("show"); return; }
  tip.textContent = t.getAttribute("data-tip"); tip.classList.add("show");
});
document.addEventListener("pointermove", e=>{
  if(!tip.classList.contains("show")) return;
  const pad=14; let xx=e.clientX+pad, yy=e.clientY+pad;
  const r=tip.getBoundingClientRect();
  if(xx+r.width>innerWidth-8) xx=e.clientX-r.width-pad;
  if(yy+r.height>innerHeight-8) yy=e.clientY-r.height-pad;
  tip.style.left=xx+"px"; tip.style.top=yy+"px";
});
document.addEventListener("focusin", e=>{
  if(e.target.classList && e.target.classList.contains("pt")){
    tip.textContent=e.target.getAttribute("data-tip"); tip.classList.add("show");
    const r=e.target.getBoundingClientRect(); tip.style.left=(r.left+r.width/2)+"px"; tip.style.top=(r.bottom+10)+"px";
  } else tip.classList.remove("show");
});

/* ---------------- scroll behaviors ---------------- */
const io = new IntersectionObserver(es=>es.forEach(x=>{ if(x.isIntersecting){ x.target.classList.add("in"); io.unobserve(x.target); } }),{threshold:.12});
function watchReveals(){ document.querySelectorAll(".reveal:not(.in)").forEach(el=>io.observe(el)); }
const stepIO = new IntersectionObserver(es=>{
  es.forEach(x=>{ if(x.isIntersecting){ selectInd(x.target.getAttribute("data-ind")||""); } });
},{threshold:.6});
function watchSteps(){ document.querySelectorAll("#bumpSteps .step").forEach(el=>stepIO.observe(el)); }
const toTop = document.getElementById("toTop");
addEventListener("scroll",()=>{ toTop.classList.toggle("show", scrollY>1200); },{passive:true});
toTop.onclick=()=>scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});

/* ---------------- read aloud ---------------- */
const VOICE_PREFS = { en:["en-sg","en-gb","en-us","en"], sg:["en-sg","en-gb","en"], zh:["zh-cn","zh-sg","cmn","zh"],
  yue:["yue","zh-hk"], ms:["ms"], ta:["ta"], th:["th"], vi:["vi"], ja:["ja"], ko:["ko"],
  hi:["hi"], ml:["ml"], si:["si"], fr:["fr"], es:["es"], de:["de"], nl:["nl"], ru:["ru"] };
const speechOK = "speechSynthesis" in window;
let sayBtnActive = null, sayQueue = [], sayEl = null;
function matchedVoices(){
  // all voices for the current language, best-sounding first
  if(!speechOK) return [];
  const prefs = VOICE_PREFS[lang] || [I18N[lang]._meta.htmlLang.toLowerCase()];
  const hits = [];
  speechSynthesis.getVoices().forEach(v=>{
    const vl = (v.lang||"").toLowerCase().replace("_","-");
    const idx = prefs.findIndex(p=>vl.startsWith(p));
    if(idx>=0) hits.push({v, idx});
  });
  const score = v=>{
    const n = v.name.toLowerCase();
    let s = 0;
    if(n.includes("natural")) s+=50;      // Edge neural voices
    if(n.includes("neural")) s+=40;
    if(n.includes("premium")) s+=32;      // Apple downloads
    if(n.includes("enhanced")) s+=28;
    if(n.includes("google")) s+=22;       // Chrome cloud voices
    if(n.includes("siri")) s+=16;
    if(n.includes("microsoft")) s+=8;
    if(n.includes("espeak")||n.includes("eloquence")||n.includes("compact")) s-=40;
    return s;
  };
  hits.sort((a,b)=> (score(b.v)-score(a.v)) || (a.idx-b.idx) || a.v.name.localeCompare(b.v.name));
  return hits.map(h=>h.v);
}
function getVoice(){
  const list = matchedVoices();
  if(!list.length) return null;
  let saved=""; try{ saved=localStorage.getItem("aishift-voice-"+lang)||""; }catch(e){}
  return list.find(v=>v.voiceURI===saved) || list[0];
}
function renderVoicePickers(){
  document.querySelectorAll(".voice-sel").forEach(el=>el.remove());
  const list = matchedVoices();
  if(list.length<2) return;
  const cur = getVoice();
  document.querySelectorAll(".listen-btn").forEach(btn=>{
    const sel = document.createElement("select");
    sel.className = "voice-sel";
    sel.setAttribute("aria-label", L("ui.voice"));
    list.forEach(v=>{
      const o = document.createElement("option");
      o.value = v.voiceURI;
      o.textContent = v.name.replace(/^(Microsoft|Google)\s+/,"");
      if(cur && v.voiceURI===cur.voiceURI) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = ()=>{
      try{ localStorage.setItem("aishift-voice-"+lang, sel.value); }catch(e){}
      document.querySelectorAll(".voice-sel").forEach(s=>{ if(s!==sel) s.value = sel.value; });
    };
    btn.after(sel);
  });
}
function chunkText(t){
  const parts = t.split(/(?<=[.!?。！？…；;])\s*/u).filter(x=>x.trim());
  const out = [];
  for(let part of (parts.length?parts:[t])){
    while(part.length>200){
      let cut = part.lastIndexOf(" ",200); if(cut<80) cut = 200;
      out.push(part.slice(0,cut)); part = part.slice(cut);
    }
    if(part.trim()) out.push(part.trim());
  }
  return out;
}
function stopSay(){
  if(speechOK) speechSynthesis.cancel();
  if(sayEl) sayEl.classList.remove("speaking");
  sayEl = null; sayQueue = [];
  if(sayBtnActive){
    sayBtnActive.setAttribute("aria-pressed","false");
    sayBtnActive.querySelector(".lbl").textContent = L("ui.listen");
    sayBtnActive = null;
  }
}
function sayNext(){
  if(sayEl) sayEl.classList.remove("speaking");
  const el = sayQueue.shift();
  if(!el){ stopSay(); return; }
  sayEl = el; el.classList.add("speaking");
  el.scrollIntoView({block:"nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto":"smooth"});
  const chunks = chunkText(el.innerText || "");
  if(!chunks.length){ sayNext(); return; }
  const voice = getVoice();
  let i = 0;
  const speakChunk = ()=>{
    if(sayEl!==el) return;
    if(i>=chunks.length){ sayNext(); return; }
    const u = new SpeechSynthesisUtterance(chunks[i++]);
    u.lang = I18N[lang]._meta.htmlLang;
    if(voice) u.voice = voice;
    u.rate = 0.98;
    u.onend = speakChunk;
    u.onerror = ()=>{ if(sayEl===el) sayNext(); };
    speechSynthesis.speak(u);
  };
  speakChunk();
}
function sayables(section){
  return [...section.querySelectorAll("[data-i18n]")].filter(el=>{
    if(el.closest(".tableview, svg, .orig-nudge, .zh-chip, .more-stub, .listen-btn, .bump-legend")) return false;
    if(el.classList.contains("note")||el.classList.contains("chart-note")||el.classList.contains("chart-src")) return false;
    if(!el.innerText || !el.innerText.trim()) return false;
    return el.offsetParent!==null;
  });
}
function showVoiceHint(btn){
  if(btn.parentElement.querySelector(".voice-hint")) return;
  const d = document.createElement("div"); d.className = "voice-hint"; d.textContent = L("ui.noVoice");
  btn.after(d); setTimeout(()=>d.remove(), 7000);
}
function initListen(){
  document.querySelectorAll(".listen-btn").forEach(btn=>{
    btn.onclick = ()=>{
      if(sayBtnActive===btn){ stopSay(); return; }
      stopSay();
      if(!speechOK){ showVoiceHint(btn); return; }
      const section = btn.closest("section");
      sayQueue = sayables(section);
      if(!getVoice()) showVoiceHint(btn);   // still try — some engines route by u.lang alone
      sayBtnActive = btn;
      btn.setAttribute("aria-pressed","true");
      btn.querySelector(".lbl").textContent = L("ui.stop");
      sayNext();
    };
  });
}
if(speechOK){
  speechSynthesis.getVoices();              // warm the voice list; some browsers populate it async
  speechSynthesis.onvoiceschanged = ()=>renderVoicePickers();
}

/* ---------------- boot ---------------- */
function renderAll(){
  stopSay();
  renderText(); buildLangUI(); renderCases(); renderBump(); renderTrends(); renderOcc(); renderWef(); renderReading(); renderArt(); setupCompare(); renderStubs(); initListen(); renderVoicePickers(); watchReveals();
}
(function init(){
  let saved="", savedCmp="";
  try{ saved=localStorage.getItem("aishift-lang")||""; savedCmp=localStorage.getItem("aishift-cmp")||""; }catch(e){}
  const m=(location.hash||"").match(/lang=([a-z]+)/);
  lang = (m && I18N[m[1]]) ? m[1] : (I18N[saved]?saved:"en");
  cmpLang = (I18N[savedCmp] && savedCmp!==lang) ? savedCmp : "";
  renderAll(); watchSteps();
})();
</script>
